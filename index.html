<style>
:root{
  color-scheme:dark;
  --bg:#141a20; --glass:rgba(20,27,34,.9); --glass2:rgba(255,255,255,.05); --ink:#E8EEF2; --muted:#9DABB5; --line:rgba(255,255,255,.11);
  --accent:#FFB547; --accent-ink:#1E1405; --teal:#45D3CB; --bad:#FF6B5B; --good:#5DD68C;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;padding-inline:0}
*{box-sizing:border-box}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;background:linear-gradient(rgba(20,26,32,.75),rgba(20,26,32,0))}
#hud h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(1.1rem,4.4vw,1.5rem);line-height:1.1;letter-spacing:.01em}
#hud h1 small{display:block;font-family:var(--mono);font-weight:400;font-size:.68rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{font-family:var(--mono);font-size:.78rem;padding:5px 10px;border-radius:8px;background:var(--glass);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat b{color:var(--accent);font-weight:600}
.stat.hit{animation:hit .5s}
@keyframes hit{30%{background:var(--bad);color:#fff}}
#bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);width:max-content;max-width:min(320px,80vw);white-space:normal!important;text-align:center;line-height:1.3;z-index:5;background:#F4F7F9;color:#11181e;font-family:var(--display);font-weight:600;font-size:.85rem;padding:6px 11px;border-radius:10px;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:opacity .25s}
#bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#F4F7F9}
#bubble.off{opacity:0}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(680px,calc(100% - 24px));max-height:60vh;overflow:auto;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:11px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
#sheet.flash{animation:flash .45s}
@keyframes flash{40%{box-shadow:0 0 0 2px var(--bad),0 20px 50px rgba(0,0,0,.45)}}
.eyebrow{margin:0;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.2;text-wrap:balance}
p{margin:0;max-width:64ch}
.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font-family:var(--display);font-weight:700;letter-spacing:.03em;font-size:.98rem;min-height:44px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;font-size:.85rem;min-height:38px;padding:7px 12px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.role strong,.role span{min-width:0;overflow-wrap:break-word;hyphens:auto}
@media (max-width:540px){.roles{grid-template-columns:1fr}}
.role{display:grid;grid-template-columns:38px 1fr;gap:4px 10px;align-items:start;text-align:left;background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .2s,background .2s}
.role:hover{border-color:rgba(255,255,255,.25)}
.role svg{grid-row:span 2;width:38px;height:38px;padding:8px;border-radius:10px;background:rgba(69,211,203,.14);color:var(--teal)}
.role strong{font-family:var(--display);font-size:.95rem;line-height:1.2}
.role span{font-size:.8rem;color:var(--muted);line-height:1.35}
.role .sk{font-size:inherit}
.role[aria-pressed="true"]{border-color:var(--teal);background:rgba(69,211,203,.13)}
.role strong .tag{font-style:normal;font-family:var(--mono);font-weight:400;font-size:.66rem;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:2px}
.role:disabled{cursor:default}
.role.wrong{border-color:var(--bad);background:rgba(255,107,91,.1);cursor:default}
.role.wrong svg{background:rgba(255,107,91,.15);color:var(--bad)}
.role.right{border-color:var(--good);background:rgba(93,214,140,.12)}
.msg{font-size:.9rem;min-height:1.3em}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.hint{font-size:.86rem;border-left:3px solid var(--teal);padding:6px 10px;background:rgba(69,211,203,.08);border-radius:0 8px 8px 0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-family:var(--mono);font-size:.72rem;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.step.now{border-color:var(--accent);color:var(--ink)}
.step.ok{border-color:var(--good);color:var(--good)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.opt{font-family:var(--mono);background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;font-variant-numeric:tabular-nums}
.opt.nope{border-color:var(--bad);color:var(--bad);animation:nope .35s}
.opt.yes{border-color:var(--good);color:var(--good)}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.result{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:480px){.result{grid-template-columns:repeat(2,1fr)}}
.result div{background:var(--glass2);border-radius:10px;padding:8px 10px}
.result b{display:block;font-family:var(--mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.result span{font-size:.75rem;color:var(--muted)}
.stars{font-size:1.6rem;letter-spacing:.12em;color:var(--accent);line-height:1}
.stars i{font-style:normal;color:rgba(255,255,255,.15)}
.help{font-size:.78rem;color:var(--muted)}
#snd{pointer-events:auto;color:var(--accent);display:inline-flex;align-items:center;cursor:pointer;min-height:28px}
#snd .x{display:none} #snd[aria-pressed="false"]{color:var(--muted)} #snd[aria-pressed="false"] .x{display:inline} #snd[aria-pressed="false"] .w{display:none}
#hud .brand{display:flex;align-items:center;gap:10px}
#hud .logo{height:40px;width:auto;background:#fff;border-radius:8px;padding:4px 6px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#apply{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,14,18,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .6s}
#apply.on{opacity:1;pointer-events:auto}
#apply .card{background:#fff;color:#11181e;border-radius:20px;padding:22px 22px 18px;width:min(380px,100%);max-height:calc(100vh - 32px);overflow:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 30px 70px rgba(0,0,0,.55);transform:translateY(16px) scale(.96);transition:transform .6s cubic-bezier(.2,.9,.3,1.2)}
#apply.on .card{transform:none}
#apply h2{font-size:clamp(1.7rem,7vw,2.3rem);color:#004f9f;letter-spacing:.01em}
#apply .qr{width:min(260px,62vw);height:auto;display:block}
#apply .btn{background:#004f9f;color:#fff}
#apply .careerLink{font-family:var(--display);font-weight:700;font-size:1.05rem;color:#004f9f;text-decoration:underline;text-underline-offset:3px;padding:6px 4px;min-height:44px;display:inline-flex;align-items:center}
#apply .careerLink:focus-visible{outline:2px solid #004f9f;outline-offset:2px;border-radius:4px}
/* phones, portrait */
@media (max-width:540px){
  body{font-size:14px}
  #hud{padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;gap:6px}
  #hud .brand{gap:7px}
  #hud .logo{height:30px;padding:3px 5px;border-radius:7px}
  #hud h1{font-size:1rem}
  #hud h1 small{display:none}
  .stats{gap:4px}
  .stat{font-size:.68rem;padding:4px 7px}
  #sheet{width:calc(100% - 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding:12px 14px;gap:8px;max-height:62vh;border-radius:14px}
  .roles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .role{grid-template-columns:1fr;gap:3px;padding:8px;text-align:center;justify-items:center}
  .role svg{grid-row:auto;width:28px;height:28px;padding:5px}
  .role strong{font-size:.88rem}
  .role strong .tag{display:block;margin:2px 0 0;width:max-content;margin-inline:auto}
  .role span{font-size:.7rem;line-height:1.25}
  h2{font-size:1.06rem}
  .muted,.msg,.hint{font-size:.84rem}
  .help{display:none}
  .row .btn{flex:1 1 auto}
  .role .sk{display:none}
  .result{gap:6px}
  .result b{font-size:1rem}
  .stars{font-size:1.3rem}
  #bubble{white-space:normal;max-width:min(240px,70vw);text-align:center;font-size:.78rem}
  #apply .card{padding:18px 16px 14px;gap:10px}
}
/* phones, landscape: task panel moves to the right side */
@media (max-height:500px) and (orientation:landscape){
  #hud{padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 10px) 6px calc(env(safe-area-inset-left,0px) + 10px)}
  #hud .logo{height:28px;padding:3px 5px}
  #hud h1{font-size:.95rem}
  #hud h1 small{display:none}
  .stat{font-size:.68rem;padding:3px 7px}
  #sheet{left:auto;right:calc(env(safe-area-inset-right,0px) + 8px);transform:none;top:46px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:min(460px,54vw);max-height:none;padding:12px 14px;gap:7px}
  #sheet p{font-size:.8rem;line-height:1.32}
  .roles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .role{grid-template-columns:1fr;gap:2px;padding:6px;text-align:center;justify-items:center}
  .role svg{grid-row:auto;width:24px;height:24px;padding:4px}
  .role strong{font-size:.82rem}
  .role strong .tag{display:none}
  .role span{display:none}
  .role{grid-template-columns:24px auto;justify-content:center;align-items:center;gap:6px}
  h2{font-size:1rem}
  #sheet .eyebrow{font-size:.62rem}
  .result span{font-size:.64rem;line-height:1.2}
  .stars{font-size:1.1rem}
  .role .sk{display:none}
  .result{grid-template-columns:repeat(4,1fr);gap:5px}
  .result div{padding:6px 8px}
  .result b{font-size:.95rem}
  .help{display:none}
  #apply .card{flex-direction:row;flex-wrap:wrap;justify-content:center;width:min(560px,100%);gap:10px 18px}
  #apply .qr{width:min(200px,42vh)}
}
/* the main action button always stays visible, even when the panel scrolls */
#sheet .row:has(> .btn:not(.ghost)){position:sticky;bottom:-16px;margin:0 -18px -16px;padding:10px 18px 14px;background:linear-gradient(rgba(20,27,34,0),rgba(20,27,34,.97) 30%);z-index:2}
@media (max-width:540px){ #sheet .row:has(> .btn:not(.ghost)){bottom:-12px;margin:0 -14px -12px;padding:8px 14px 10px} }
@media (max-height:500px) and (orientation:landscape){ #sheet .row:has(> .btn:not(.ghost)){bottom:-12px;margin:0 -14px -12px;padding:8px 14px 10px} }
#qrMini{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:4;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:#fff;border-radius:12px;padding:7px 7px 5px;box-shadow:0 8px 22px rgba(0,0,0,.4);text-decoration:none}
#qrMini img{width:96px;height:96px;display:block}
#qrMini span{font-family:var(--display);font-weight:700;font-size:.7rem;color:#004f9f;line-height:1.1}
/* narrower screens: the task panel would sit in the corner, so the code moves up under the header */
@media (max-width:1100px) and (min-height:501px), (max-width:540px){
  #qrMini{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 92px);right:calc(env(safe-area-inset-right,0px) + 10px);padding:5px 5px 4px;border-radius:9px}
  #qrMini img{width:64px;height:64px}
  #qrMini span{font-size:.56rem}
}
@media (min-width:541px) and (max-width:1100px) and (min-height:501px){ #qrMini{top:calc(env(safe-area-inset-top,0px) + 70px)} #qrMini img{width:78px;height:78px} }
/* phones in landscape: panel is on the right, so the code goes to the top left under the header */
@media (max-height:500px) and (orientation:landscape){
  #qrMini{bottom:auto;right:auto;top:calc(env(safe-area-inset-top,0px) + 46px);left:calc(env(safe-area-inset-left,0px) + 10px);padding:4px 4px 3px;border-radius:8px}
  #qrMini img{width:56px;height:56px}
  #qrMini span{font-size:.5rem}
}
a.qrInSheet{display:none}
@media (pointer:coarse) and (max-width:1100px), (max-width:540px), (max-height:500px) and (orientation:landscape){
  #qrMini{display:none!important}
  a.qrInSheet{display:flex;position:absolute;top:10px;right:10px;z-index:3;flex-direction:column;align-items:center;gap:1px;background:#fff;border-radius:8px;padding:4px 4px 2px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  a.qrInSheet img{width:56px;height:56px;display:block}
  a.qrInSheet span{font-family:var(--display);font-weight:700;font-size:.5rem;color:#004f9f;line-height:1.1;white-space:nowrap}
}
#aiNote{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:4;pointer-events:none;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;color:var(--muted);background:rgba(20,27,34,.78);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
/* if the task panel would cover the corner (narrow screens), the note moves under the header */
@media (max-width:1100px) and (min-height:501px), (max-width:540px){ #aiNote{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 56px);left:calc(env(safe-area-inset-left,0px) + 10px);font-size:.6rem} }
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
const sheet = document.getElementById('sheet');
function fatal(msg){ sheet.innerHTML = `<p class="eyebrow">Hinweis</p><h2>Die 3D-Szene startet nicht</h2><p class="muted">${msg}</p>`; }
if(!window.THREE){ fatal('Die 3D-Bibliothek konnte nicht geladen werden. Bitte die Seite neu laden.'); return; }
const T = THREE;
const canvas = document.getElementById('c');
let renderer;
try { renderer = new T.WebGLRenderer({canvas, antialias:true}); }
catch(e){ fatal('Dein Browser unterstützt kein WebGL. Probiere es in einem aktuellen Browser oder auf einem anderen Gerät.'); return; }

const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const rand = (a,b)=>a+Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const V = (x,y,z)=>new T.Vector3(x,y,z);

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;

const scene = new T.Scene();
const BG = 0x1b2229;
scene.background = new T.Color(BG);
scene.fog = new T.Fog(BG, 10, 30);
const camera = new T.PerspectiveCamera(40, 1, 0.05, 80);

/* ---------- lights ---------- */
scene.add(new T.HemisphereLight(0xdde7ef, 0x2b2622, 0.7));
const key = new T.DirectionalLight(0xffffff, 0.8);
key.position.set(4, 9, 6); key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:25});
scene.add(key);
const warm = new T.PointLight(0xffb547, 0.45, 7); warm.position.set(1.4, 3.4, 2.4); scene.add(warm);
const cool = new T.PointLight(0x5fd7ff, 0.25, 9); cool.position.set(-3, 3, 3); scene.add(cool);

/* ---------- helpers ---------- */
const mat = (color, o={}) => new T.MeshStandardMaterial(Object.assign({color, roughness:.55, metalness:.1}, o));
function rbox(w,h,d,r=.05){
  r = Math.min(r, w/2-0.001, h/2-0.001, d/2-0.001);
  const s = new T.Shape(), x=-(w/2-r), y=-(h/2-r), ww=w-2*r, hh=h-2*r;
  s.moveTo(x,y); s.lineTo(x+ww,y); s.lineTo(x+ww,y+hh); s.lineTo(x,y+hh); s.lineTo(x,y);
  const g = new T.ExtrudeGeometry(s,{depth:Math.max(.001,d-2*r), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:3, curveSegments:4});
  g.center(); return g;
}
function add(geo, m, x=0,y=0,z=0, parent=scene, shadow=true){
  const o = new T.Mesh(geo, m); o.position.set(x,y,z);
  if(shadow){ o.castShadow = true; o.receiveShadow = true; }
  parent.add(o); return o;
}
function canvasTex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new T.CanvasTexture(c); t.anisotropy=4; t.userData={c,g}; return t;
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function labelTex(text,{w=512,h=128,bg='rgba(12,18,24,.85)',fg='#E8EEF2',border=null,font='600 56px "IBM Plex Mono", monospace',radius=18,dashed=false,align='center'}={}){
  return canvasTex(w,h,(g)=>{
    if(bg){ roundRect(g,4,4,w-8,h-8,radius); g.fillStyle=bg; g.fill(); }
    if(border){ roundRect(g,4,4,w-8,h-8,radius); g.lineWidth=5; g.strokeStyle=border; if(dashed) g.setLineDash([16,12]); g.stroke(); g.setLineDash([]); }
    g.fillStyle=fg; g.font=font; g.textBaseline='middle';
    const maxW = w - (align==='center'?44:56), tw=g.measureText(text).width;
    if(tw>maxW){ const px=parseFloat((font.match(/(\d+(?:\.\d+)?)px/)||[0,56])[1]); g.font=font.replace(/\d+(?:\.\d+)?px/, Math.floor(px*maxW/tw)+'px'); }
    g.textAlign=align; g.fillText(text, align==='center'?w/2:28, h/2+2);
  });
}
function labelPlane(text, pw, ph, opts={}){
  const px=512, tex=labelTex(text,Object.assign({w:px,h:Math.round(px*ph/pw)},opts));
  return new T.Mesh(new T.PlaneGeometry(pw,ph), new T.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,side:T.DoubleSide}));
}
function sprite(text, sw, opts={}){
  const w=512, h=opts.h||128, tex=labelTex(text,Object.assign({w,h},opts));
  const s=new T.Sprite(new T.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  s.scale.set(sw, sw*h/w, 1); return s;
}
const hitMat = new T.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false});

/* ---------- hall ---------- */
const floorTex = canvasTex(1024,1024,(g,w,h)=>{
  g.fillStyle='#3a4148'; g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){ g.fillStyle=`rgba(255,255,255,${Math.random()*.05})`; g.fillRect(Math.random()*w,Math.random()*h,2,2); }
  g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=3; g.strokeRect(0,0,w,h);
});
floorTex.wrapS=floorTex.wrapT=T.RepeatWrapping; floorTex.repeat.set(10,10);
const floor = add(new T.PlaneGeometry(60,60), mat(0xffffff,{map:floorTex,roughness:.8}), 0,0,0, scene, false);
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true;
const yellow = mat(0xf2c230,{roughness:.6});
[[0,0.002,2.4,26,.1],[0,0.002,-2.1,26,.1]].forEach(([x,y,z,w,d])=>{ const l=add(new T.PlaneGeometry(w,d),yellow,x,y,z,scene,false); l.rotation.x=-Math.PI/2; });
// safety hatching zone in front of module
const hatch = canvasTex(256,64,(g,w,h)=>{ g.fillStyle='#f2c230'; g.fillRect(0,0,w,h); g.fillStyle='#1d1d1d'; for(let i=-2;i<12;i++){ g.beginPath(); g.moveTo(i*32,h); g.lineTo(i*32+16,h); g.lineTo(i*32+48,0); g.lineTo(i*32+32,0); g.fill(); } });
hatch.wrapS=T.RepeatWrapping;

// back wall + windows
const wall = add(new T.PlaneGeometry(60,12), mat(0x2a323a,{roughness:.9}), 0,6,-9, scene, false);
for(let i=-4;i<=4;i++){ const win=add(new T.PlaneGeometry(2.4,1.2), new T.MeshBasicMaterial({color:0x6f8fa8}), i*3.2, 5.2, -8.98, scene, false); }
for(let i=-3;i<=3;i++){ add(new T.BoxGeometry(3,.06,.3), new T.MeshBasicMaterial({color:0xf3f7fa}), i*4, 6.5, -2, scene, false); }

const alu = mat(0xb8c2ca,{metalness:.6,roughness:.35});
const dark = mat(0x22282e,{roughness:.6});
const glass = new T.MeshStandardMaterial({color:0xaee3ff,transparent:true,opacity:.18,roughness:.1,metalness:.1,depthWrite:false});

function tower(parent,x,y,z){
  const g=new T.Group(); g.position.set(x,y,z); parent.add(g);
  add(new T.CylinderGeometry(.018,.018,.2,8),alu,0,.1,0,g);
  const cols=[0x5dd68c,0xffb547,0xff5b4a], ms=[];
  cols.forEach((c,i)=>{ const m=new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.1,transparent:true,opacity:.9}); ms.push(m); add(new T.CylinderGeometry(.05,.05,.09,16),m,0,.25+i*.095,0,g); });
  add(new T.CylinderGeometry(.052,.052,.02,16),dark,0,.25+3*.095-.035,0,g);
  g.userData.set = s => ms.forEach((m,i)=>{ m.emissiveIntensity = (s===['green','yellow','red'][i]) ? 1.6 : .08; });
  g.userData.set('green'); return g;

function flyTo(name, dur=1.3){
  const v=VIEWS[name], s={t:cam.target.clone(),az:cam.az,pol:cam.pol,dist:cam.dist,w:cam.w,h:cam.h};

  camBusy=true;

const SIDE_MQ = matchMedia('(max-height:500px) and (orientation:landscape)');
let offX=0;
function applyCam(dt){
  const side = SIDE_MQ.matches;
  const target = side ? 0 : Math.max(0, sheet.offsetHeight - 36);
  const targetX = side ? sheet.offsetWidth + 16 : 0;
  off += (target-off)*Math.min(1,dt*5); offX += (targetX-offX)*Math.min(1,dt*5);
  const tn = Math.tan(T.MathUtils.degToRad(camera.fov/2));
  if(side){ // free area is left of the panel
    const hud=50, aFree=(W-offX)/H, vis=Math.max(.3,(H-hud)/H);
    const d = Math.max(cam.dist, cam.w/(2*tn*aFree), cam.h/(2*tn*vis));
    camera.position.set(cam.target.x + d*Math.sin(cam.pol)*Math.sin(cam.az), cam.target.y + d*Math.cos(cam.pol), cam.target.z + d*Math.sin(cam.pol)*Math.cos(cam.az));
    camera.lookAt(cam.target);
    camera.aspect=(W+offX)/H; camera.setViewOffset(W+offX,H,offX,0,W,H); camera.updateProjectionMatrix();
    return;
  }
  const hudH = W<=540 ? 70 : 60, cw = (W<H && W<=540) ? cam.w*.8 : cam.w;
  const aEff = W/(H+off), vis = Math.max(.25,(H-off-hudH)/(H+off));
  const d = Math.max(cam.dist, cw/(2*tn*aEff), cam.h/(2*tn*vis));
  camera.position.set(cam.target.x + d*Math.sin(cam.pol)*Math.sin(cam.az), cam.target.y + d*Math.cos(cam.pol), cam.target.z + d*Math.sin(cam.pol)*Math.cos(cam.az));
  camera.lookAt(cam.target);
  camera.aspect = W/(H+off); camera.setViewOffset(W,H+off,0,off,W,H); camera.updateProjectionMatrix();
}

const pickables=[];
const ray = new T.Raycaster(), ndc = new T.Vector2();
const ptrs = new Map(); let down=null, pinch0=0, dist0=0;
function hitAt(x,y){
  const r=canvas.getBoundingClientRect(); ndc.set((x-r.left)/r.width*2-1, -((y-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickables,true);
  for(const h of hits){ let o=h.object; while(o && !o.userData.pick) o=o.parent; if(o && o.userData.pick && o.visible!==false) return o; }
  return null;
}
canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(ptrs.size===1) down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0,az:cam.az,pol:cam.pol}; if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); dist0=cam.dist; down=null; } });
canvas.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){ if(e.pointerType==='mouse') canvas.style.cursor = hitAt(e.clientX,e.clientY)?'pointer':'grab'; return; }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(camBusy) return;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); cam.dist=Math.min(10,Math.max(1.6,dist0*pinch0/Math.max(d,1))); return; }
  if(down){ const dx=e.clientX-down.x, dy=e.clientY-down.y; down.moved=Math.max(down.moved,Math.hypot(dx,dy));
    if(down.moved>6){ cam.az=down.az - dx*.006; cam.pol=Math.min(1.52,Math.max(.55,down.pol - dy*.005)); } }
});
function up(e){ ptrs.delete(e.pointerId);
  if(down && down.moved<8 && performance.now()-down.t<600){ const o=hitAt(e.clientX,e.clientY); if(o) o.userData.pick(o); }
  if(ptrs.size===0) down=null; }
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId); down=null;});

const _tl=new T.Vector3(), _hw=new T.Vector3();
const UPPER=.29, FORE=.28;
function armSolve(p,target){
  p.root.updateMatrixWorld(true);
  const A=p.arms[0], L1=UPPER, L2=FORE+p.tool, LM=L1+L2-.006;
  _tl.copy(target); p.root.worldToLocal(_tl); _tl.sub(A.g.position);
  let d=_tl.length(), tip=0;
  if(d>LM && _tl.y>0){ tip=Math.min(.1,d-LM); _tl.y-=tip; d=_tl.length(); }
  const dir=_tl.clone().divideScalar(d||1), dc=T.MathUtils.clamp(d,.14,LM);
  const al=Math.acos(T.MathUtils.clamp((L1*L1+dc*dc-L2*L2)/(2*L1*dc),-1,1));
  const hint=V(A.s*.45,-1,-.3); hint.addScaledVector(dir,-hint.dot(dir));
  if(hint.lengthSq()<1e-6) hint.set(A.s,0,0); hint.normalize();
  const u=dir.clone().multiplyScalar(Math.cos(al)).addScaledVector(hint,Math.sin(al));

  const zMax = (G.dev && G.dev.holo) ? 1.5 : 1.12, x0=-.07, x1=2.47, z0=-1.12;
  if(s.x>x0 && s.x<x1 && s.z>z0 && s.z<zMax){
    const o=[[s.x-x0,'x',x0],[x1-s.x,'x',x1],[s.z-z0,'z',z0],[zMax-s.z,'z',zMax]].sort((a,b)=>a[0]-b[0])[0];

function buildCable(c){

const S = .028; // 1 mm module in world units
const gearCache={};
function gearGeo(z){
  if(gearCache[z]) return gearCache[z];
  const m=S, r=m*z/2, ra=r+m, rf=r-1.25*m, step=2*Math.PI/z, s=new T.Shape();
  for(let i=0;i<z;i++){ const a=i*step;
    const pts=[[rf,a-step*.5],[rf,a-step*.27],[ra,a-step*.13],[ra,a+step*.13],[rf,a+step*.27]];
    pts.forEach(([rr,aa],k)=>{ const x=rr*Math.cos(aa), y=rr*Math.sin(aa); if(i===0&&k===0) s.moveTo(x,y); else s.lineTo(x,y); });
  }
  s.closePath();
  const hole=new T.Path(); hole.absarc(0,0,Math.max(.03,r*.22),0,Math.PI*2,true); s.holes.push(hole);
  const g=new T.ExtrudeGeometry(s,{depth:.03,bevelEnabled:true,bevelThickness:.003,bevelSize:.003,bevelSegments:1,curveSegments:8});
  g.translate(0,0,-.015); g.rotateY(Math.PI/2);
  return gearCache[z]=g;
}

  const steel=mat(0x9aa4ac,{metalness:.75,roughness:.3}), brassM=mat(0xc08a3e,{metalness:.8,roughness:.3});
  const motor=add(gearGeo(z1),steel,x,yM,0,taskG);
  const grinder=add(gearGeo(z2),brassM,x,yG,0,taskG);
  [motor,grinder].forEach(g=>add(new T.CylinderGeometry(.03,.03,.05,12).rotateZ(Math.PI/2),dark,x,g.position.y,0,taskG));
  G.eng={zi,z1,z2,D,n1,yG,yM,yI,x,motor,grinder,idler:null,stage:0,busy:false};
  motor.rotation.x=Math.PI/2; grinder.rotation.x=-Math.PI/2;
}

const _hv=new T.Vector3();
function handLocal(p){ p.arms[0].hand.getWorldPosition(_hv); return M.worldToLocal(_hv.clone()); }
// Jonas uses a walkway on the outer side of the spare-parts shelf, so he never walks through the gears
const LANE=2.88, BOX_X=2.47;
async function laneTo(p,z,endX=LANE){
  const P=p.root.position, pts=[];
  if(Math.abs(P.x-LANE)>.04) pts.push(V(LANE,0,P.z));
  pts.push(V(LANE,0,z));
  if(Math.abs(endX-LANE)>.01) pts.push(V(endX,0,z));
  await walkPath(p,pts,2.2);
}
async function viaHand(g){

  p.carry=g; await handTo(p, holdPt(p), .35);  // take it to the chest

}
// carry the held gear to a spot (M-local), then let go of it there
async function gearTo(p,g,local,dur=.5){
  const w=()=>M.localToWorld(local.clone()), W=w();
  await laneTo(p, W.z, W.x>2.55 ? LANE : BOX_X);   // shelf spot or gearbox

function clearSpares(e,keep){
  const objs=[...e.extras];
  e.spares.forEach(s=>{ if(s.g===keep) return; objs.push(s.g,s.lab); s.g.userData.placed=true; const k=pickables.indexOf(s.g); if(k>=0) pickables.splice(k,1); });
  const sc=objs.map(o=>o.scale.clone());
  tween(.6,p=>objs.forEach((o,i)=>o.scale.copy(sc[i]).multiplyScalar(Math.max(.001,1-p)))).then(()=>objs.forEach(o=>taskG.remove(o)));
}
async function onGear(g){
  const e=G.eng; if(!active('eng')||e.stage!==0||e.busy) return;
  e.busy=true; const z=g.userData.z, home=g.userData.home, target=V(e.x,e.yI,0);
  const jp=people.eng;
  await viaHand(g);
  if(z===e.zi){
    e.q.visible=false;
    await gearTo(jp,g,target,.6); release(jp);
    g.userData.placed=true; e.idler=g; clearSpares(e,g);
    gearSpin={t:0,only:false}; e.stage=1; e.busy=false; stepDone(G.role==='team'?1:0);
    msg('Passt. Das Getriebe läuft wieder.','good'); beans.userData.shake=true;
    if(G.role==='team'){ say('Getriebe ist drin. Sam, du bist dran.',3,people.eng); gearSpin=null; setTimeout(teamNext,900); return; }
    say('Sitzt. Jetzt noch die Drehzahl gegenrechnen.',3,people.eng);
    instr('Letzter Check vor dem Probelauf:');
    const opts=[...new Set([Math.round(e.n1*e.z1/e.z2), e.n1, Math.round(e.n1*e.z2/e.z1), Math.round(e.n1*e.z1/e.zi)])].slice(0,4);
    $('#extra').innerHTML=`<p style="margin-bottom:8px">Mit welcher Drehzahl läuft das Mahlwerk (z₂ = ${e.z2}), wenn der Motor mit n₁ = ${e.n1} min⁻¹ dreht?</p><div class="opts">${shuffle(opts).map(v=>`<button class="opt" data-v="${v}">${v} min⁻¹</button>`).join('')}</div>`;
    document.querySelectorAll('#extra .opt').forEach(b=>b.onclick=()=>{
      if(e.stage!==1) return; const v=+b.dataset.v, right=Math.round(e.n1*e.z1/e.z2);
      if(v===right){ e.stage=2; b.classList.add('yes'); stepDone(1); clearEngLabels(); msg(`Richtig. Das Zwischenrad ändert nur die Drehrichtung, nicht die Übersetzung: i = ${e.z2}/${e.z1}.`,'good'); setTimeout(taskDone,1400); }
      else { b.classList.add('nope'); penalty(10,'mistake'); msg('Nicht ganz. Entscheidend ist das Verhältnis der Zähnezahlen von Motor und Mahlwerk.','bad'); }
    });
    return;
  }
  const tooSmall = z<e.zi;
  g.material.emissive.set(0x661a12);
  const stopAt = tooSmall ? target : V(e.x+.28,e.yI,0);
  await gearTo(jp,g,stopAt,.6); jp.ik=worldOf(g);
  penalty(10,'mistake');
  msg(tooSmall ? `z = ${z} ist zu klein: Das Rad erreicht die Nachbarräder nicht.` : `z = ${z} ist zu groß: Das Rad kollidiert mit Motor und Mahlwerk.`,'bad');
  say(tooSmall?'Zu klein, das greift nicht.':'Zu groß, das passt nicht rein.',2.5,people.eng);
  if(!tooSmall) await tween(.4,p=>g.position.x=stopAt.x+Math.sin(p*Math.PI*5)*.02,t=>t);
  await wait(.6);
  jp.carry=g; await handTo(jp, holdPt(jp), .3);
  await gearTo(jp,g,home.clone(),.45); await release(jp);
  g.material.emissive.set(0x000000); e.busy=false;
}
function tickGears(dt){
  if(!gearSpin||!G.eng) return; const e=G.eng; gearSpin.t+=dt; const w=2.2, t=gearSpin.t;
  e.motor.rotation.x = Math.PI/2 + w*t;
  if(gearSpin.only) return;
  const step=z=>2*Math.PI/z;
  e.idler.rotation.x = -Math.PI/2 + step(e.zi)/2 - w*t*e.z1/e.zi;
  e.grinder.rotation.x = -Math.PI/2 + w*t*e.z1/e.z2;
}

/* ---------- brew + result ---------- */
async function taskDone(){
  clearEngLabels();
  if(G.phase!=='task') return;
  G.phase='brew'; G.timing=false; G.t1=performance.now(); stepAll();
  const crew=needed(G.role), team=G.role==='team';
  sheet.innerHTML=`<p class="eyebrow">Probelauf</p><h2>Modul 07 brüht</h2><p class="muted">Freigabe erteilt. Die Maschine bezieht den ersten Espresso.</p>`;
  if(G.eng && G.eng.idler) gearSpin={t:0,only:false}; else gearSpin=null;
  tween(.8,p=>{ hatchL.rotation.y*= (1-p); hatchR.rotation.y*=(1-p); });
  const p0=robot.position.clone(), r0=robot.rotation.y;
  tween(1.6,p=>{ robot.position.lerpVectors(p0,V(-.6,0,1.3),p); robot.rotation.y=r0+(Math.PI/2-.3-r0)*p; wheels.forEach(w=>w.rotation.x=p*10); });
  face('happy'); say('Keine Sorge, ich halte jetzt Abstand.',3);
  crew.forEach(k=>faceTo(people[k],V(1.0,0,4)));
  await flyTo('brew',1.5);
  sigTower.userData.set('yellow'); ledMat.color.set(0xffb547); ledMat.emissive.set(0xffb547);
  drawDisplay('BRÜHT …','Espresso · 93 °C','#FFB547');
  stream.visible=true; coffee.visible=true;
  await tween(.35,p=>stream.scale.y=.001+.83*p,t=>t);
  let steamT=0;
  await tween(2.6,p=>{ coffee.scale.y=.001+.12*p; steamT+=1; if(steamT%12===0) puff(M.localToWorld(V(0,.3,.95)),{color:0xffffff,n:1,up:.35,size:.18,life:1.6}); },t=>t);
  await tween(.3,p=>stream.scale.y=.831*(1-p)+.001);
  stream.visible=false; gearSpin=null; beans.userData.shake=false;
  sigTower.userData.set('green'); ledMat.color.set(0x5dd68c); ledMat.emissive.set(0x5dd68c);
  drawDisplay('GENIESSEN','1 × Espresso');
  steamLoop=true;
  crew.forEach(k=>people[k].mode='cheer');
  say(crew.length>1?'Danke euch dreien! Die erste Runde geht auf mich.':`Danke, ${ROLES[crew[0]].person}! Der erste geht auf mich.`,4);
  setTimeout(()=>{ crew.forEach(k=>{ if(people[k].mode==='cheer') people[k].mode='idle'; }); if(team) showApply(); },2600);
  result();
}
{ const src=document.querySelector('#apply .qr').src; document.querySelector('#qrMini img').src=src; }
// on phones/tablets the small code sits right under the header; measure the header so they never overlap
const NARROW_MQ=matchMedia('(max-width:1100px) and (min-height:501px), (max-width:540px), (max-height:500px) and (orientation:landscape)');
function placeQrMini(){
  const q=document.getElementById('qrMini'); if(!q) return;
  q.style.top='';
  if(!NARROW_MQ.matches) return;   // wide screens: bottom-right corner (set in CSS)
  const hb=document.getElementById('hud').getBoundingClientRect().bottom;
  const ai=document.getElementById('aiNote').getBoundingClientRect();
  let top=Math.round(hb)+4;
  if(SIDE_MQ.matches && ai.bottom>0 && ai.top<120) top=Math.max(top, Math.round(ai.bottom)+6);
  q.style.top=top+'px';
}
addEventListener('resize',placeQrMini); addEventListener('orientationchange',()=>setTimeout(placeQrMini,300));
if(window.ResizeObserver) new ResizeObserver(placeQrMini).observe(document.getElementById('hud'));
placeQrMini(); setTimeout(placeQrMini,1500);
// phones: a small, tappable application code in the top-right corner of the task panel.
// Every text block beside it gets right padding, so the code never covers any text.
const QR_SRC=document.querySelector('#apply .qr').src;
let qrBusy=false;
function layoutSheetQr(){
  if(qrBusy) return; qrBusy=true;
  let a=sheet.querySelector(':scope > a.qrInSheet');
  if(!a){ a=document.createElement('a'); a.className='qrInSheet'; a.href='https://smartfactory.de/karriere/'; a.target='_blank'; a.rel='noopener';
    a.setAttribute('aria-label','Jetzt bewerben: Karriereseite der SmartFactory KL');
    a.innerHTML='<img alt="" src="'+QR_SRC+'"><span>Jetzt bewerben</span>'; sheet.appendChild(a); }
  const kids=[...sheet.children].filter(c=>c!==a);
  kids.forEach(c=>{ c.style.paddingRight=''; c.querySelectorAll(':scope > i.qrSpace').forEach(x=>x.remove()); });
  if(getComputedStyle(a).display!=='none'){
    const pad=a.offsetWidth+10, bottom=a.offsetTop+a.offsetHeight+4;
    // top to bottom: blocks that end beside the code get right padding;
    // a text block that reaches below it flows around it (only its first lines get shorter)
    kids.forEach(c=>{
      if(c.offsetTop>=bottom || c.matches('.row:has(> .btn:not(.ghost))')) return;
      if(c.offsetTop+c.offsetHeight<=bottom || !/^(P|H2)$/.test(c.tagName)){ c.style.paddingRight=pad+'px'; return; }
      c.style.paddingRight=pad+'px';
      if(c.offsetTop+c.offsetHeight<=bottom) return;           // fits beside the code once padded
      c.style.paddingRight='';
      const sp=document.createElement('i'); sp.className='qrSpace';
      sp.style.cssText='float:right;display:block;width:'+pad+'px;height:'+Math.max(0,bottom-c.offsetTop)+'px'; c.prepend(sp);
    });
  }
  qrBusy=false;
}
const ownNode=n=>n.nodeType===1 && (n.classList.contains('qrSpace')||n.classList.contains('qrInSheet'));
let qrRaf=0;
new MutationObserver(recs=>{
  // ignore the changes this layout makes itself; react to new texts (task steps, hints, messages)
  if(recs.every(r=>[...r.addedNodes,...r.removedNodes].every(ownNode))) return;
  cancelAnimationFrame(qrRaf); qrRaf=requestAnimationFrame(layoutSheetQr);
}).observe(sheet,{childList:true,subtree:true,characterData:true});
addEventListener('resize',layoutSheetQr); addEventListener('orientationchange',()=>setTimeout(layoutSheetQr,300));
layoutSheetQr();
function showApply(){ if(G.phase!=='result') return; const a=$('#apply'); a.classList.add('on'); a.setAttribute('aria-hidden','false'); }
function hideApply(){ const a=$('#apply'); a.classList.remove('on'); a.setAttribute('aria-hidden','true'); }
function stepAll(){ document.querySelectorAll('#steps .step').forEach(s=>{s.classList.remove('now');s.classList.add('ok');}); }
let steamLoop=false;
function result(){
  G.phase='result';
  const team=G.role==='team', lim=team?180:90;
  const secs=Math.round((G.t1-G.t0)/1000), bonus=Math.max(0,lim-secs);
  const base=Math.max(0,G.score), sum=base+bonus; G.total+=sum; setPts();
  const stars = (G.score>=90 && bonus>=lim*.4) ? 3 : (G.score>=60 ? 2 : 1);
  const verdict = ['', 'Läuft wieder, aber das Protokoll wird lang.', 'Solide Instandsetzung. Mit weniger Umwegen gibt es drei Sterne.', team?'Richtig erkannt, sauber übergeben, gemeinsam gelöst.':'Sauber diagnostiziert, schnell behoben. So sieht Instandhaltung aus.'][stars];
  const last=G.round>=LEVELS;
  sheet.innerHTML=`<p class="eyebrow">Level ${G.round}/${LEVELS} abgeschlossen · ${team?'Team-Einsatz':ROLES[G.role].person}</p>
    <h2>${team?'Teamarbeit: Modul 07 läuft wieder':'Modul 07 ist wieder in Betrieb'}</h2>
    <div class="row"><span class="stars" aria-label="${stars} von 3 Sternen">${'★'.repeat(stars)}<i>${'★'.repeat(3-stars)}</i></span><span class="muted">${verdict}</span></div>
    <div class="result">
      <div><b>+${sum}</b><span>Punkte in diesem Level</span></div>
      <div><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b><span>Zeit (Bonus +${bonus})</span></div>
      <div><b>${G.wrongPick}</b><span>Fehlbesetzungen (−25)</span></div>
      <div><b>${G.mistakes + G.hints}</b><span>Fehlgriffe / Hinweise</span></div>
    </div>
    ${last?`<p><b>Alle ${LEVELS} Level geschafft!</b> Gesamtpunktzahl: <b>${G.total}</b></p>`:''}
    <div class="row"><button class="btn" id="again">${last?'Nochmal spielen':'Nächstes Level'}</button><span class="help">${last?'Startet wieder bei Level 1.':`Danach noch ${LEVELS-G.round} Level.`}</span></div>`;
  const next=()=>{ stopAuto(); hideApply(); steamLoop=false; intro(); };
  $('#again').onclick=next;
  if(!last) autoGo('#again', 3, 'Nächstes Level', next);
}

/* ---------- loop ---------- */
const clock=new T.Clock(); let time=0, steamAcc=0;
const headPos=new T.Vector3();
function loop(){
  const dt=Math.min(.05,clock.getDelta()); time+=dt;
  tickTweens(dt); tickParts(dt); tickGears(dt);
  Object.values(people).forEach(p=>tickPerson(p,dt,time));
  bobbers.forEach(b=>b.update(time,dt));
  // ambient
  if(!REDUCE){
    pallets.forEach(p=>{ p.position.x+=dt*.35; if(p.position.x>5) p.position.x=-6.3; });
    armYaw.rotation.y=Math.sin(time*.6)*1.1; armA.rotation.z=.4+Math.sin(time*.9)*.25; armB.rotation.z=.9+Math.sin(time*1.1+1)*.35;
    head.rotation.y=Math.sin(time*.8)*.12; rb.position.y=Math.sin(time*2.2)*.008;
  }
  antMat.emissiveIntensity=.6+.8*(.5+.5*Math.sin(time*3));
  if(G.phase!=='intro' && G.phase!=='boot' && ['choose','dispatched','task'].includes(G.phase)){
    sigTower.userData.set(Math.sin(time*6)>0?'red':'off');
  }
  if(beans.userData.shake) beans.position.y=Math.sin(time*40)*.004;
  // tech sparks
  if((G.role==='tech'||G.role==='team') && ['choose','dispatched','task'].includes(G.phase) && G.tech && G.tech.done<3){
    techSparkTimer-=dt; if(techSparkTimer<=0){ techSparkTimer=rand(.5,1.4); const loose=Object.values(G.tech.cables).filter(c=>!c.done); if(loose.length) sparks(M.localToWorld(pick(loose).end.clone()),6); }
  }
  if(steamLoop){ steamAcc+=dt; if(steamAcc>.35){ steamAcc=0; puff(M.localToWorld(V(0,.3,.95)),{color:0xffffff,n:1,up:.3,size:.16,life:1.8}); } }
  if(G.timing){ const s=Math.floor((performance.now()-G.t0)/1000); $('#tm').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
  applyCam(dt);
  // speech bubble follows Smarty
  const b=$('#bubble');
  if(!b.classList.contains('off')){ (speaker?speaker.head:head).getWorldPosition(headPos); headPos.y+=speaker?.3:.5; headPos.project(camera);
    const r=canvas.getBoundingClientRect(), bw=b.offsetWidth, bh=b.offsetHeight, hudB=$('#hud').offsetHeight+4;
    let x=(headPos.x+1)/2*r.width, y=(1-headPos.y)/2*r.height;
    x=Math.min(Math.max(x, bw/2+8), r.width-bw/2-8); y=Math.min(Math.max(y, bh+hudB), r.height-8);
    b.style.left=x+'px'; b.style.top=y+'px'; b.style.visibility=headPos.z<1?'visible':'hidden'; }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

const fontsReady = document.fonts ? Promise.race([Promise.all(['600 40px "IBM Plex Mono"','700 40px "Chakra Petch"'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,1800))]) : Promise.resolve();
fontsReady.catch(()=>{}).then(()=>{
  // redraw textures that were drawn before fonts arrived
  drawDisplay('BEREIT','Espresso · 93 °C');
  chest.material.map=labelTex('SMARTY',{w:512,h:Math.round(512*.075/.3),bg:'#0f1a1f',fg:'#45D3CB',font:'700 120px "Chakra Petch", sans-serif',radius:30});
  plate.material.map=labelTex('MODUL 07 · KAFFEE',{w:512,h:Math.round(512*.12/.9),bg:'#2f3740',fg:'#FFB547',font:'700 44px "Chakra Petch", sans-serif',radius:6});
  intro(); loop();
});
})();
